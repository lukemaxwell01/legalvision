<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Papers Master Sheet Preview</title>
<style>
body{margin:0;background:#0b0f17;color:white;font-family:Arial,sans-serif;}
.top-bar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:#111827;border-bottom:1px solid #1f2937;box-sizing:border-box;}
.top-bar h2{margin:0;font-size:18px;}
.download-text-btn{background:#fff;color:#000;padding:10px 20px;border-radius:12px;text-decoration:none;font-weight:800;font-size:15px;}
.table-wrap{padding:30px;overflow:auto;height:calc(100vh - 130px);box-sizing:border-box;}
table{border-collapse:collapse;width:100%;min-width:900px;background:#111827;color:#e5e7eb;}
th,td{border:1px solid rgba(148,163,184,.25);padding:10px 12px;text-align:left;vertical-align:top;font-size:14px;}
th{background:#1f2937;color:#fff;position:sticky;top:0;}
.note{padding:12px 30px;color:#aab3c2;}
@media(max-width:650px){.top-bar{padding:0 16px;}.top-bar h2{font-size:14px;}.download-text-btn{padding:9px 14px;font-size:13px;}}
</style>
</head>
<body>
<div class="top-bar">
  <h2>Research Papers Master Sheet Preview</h2>
  <a class="download-text-btn" href="documents/Status_Document_1_MasterSheet.csv" download>Download</a>
</div>
<div class="note">Preview shows the CSV table. Use Download to save the original file.</div>
<div class="table-wrap">
  <table>
    <tbody><tr><td>CSV preview is not available. Please use Download.</td></tr></tbody>
  </table>
</div>
</body>
</html>
