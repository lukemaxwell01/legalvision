<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Presentation II Preview</title>
<style>
body{margin:0;background:#0b0f17;color:white;font-family:Arial,sans-serif;}
.top-bar{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 40px;
  background:#111827;
  border-bottom:1px solid #1f2937;
  box-sizing:border-box;
}
.top-bar h2{margin:0;font-size:18px;}
.download-text-btn{
  background:#ffffff;
  color:#000000;
  padding:10px 20px;
  border-radius:12px;
  text-decoration:none;
  font-weight:800;
  font-size:15px;
}
iframe{width:100%;height:calc(100vh - 70px);border:none;background:white;}
@media(max-width:650px){
  .top-bar{padding:0 16px;}
  .top-bar h2{font-size:14px;}
  .download-text-btn{padding:9px 14px;font-size:13px;}
}
</style>
</head>
<body>
<div class="top-bar">
  <h2>Progress Presentation II Preview</h2>
  <a class="download-text-btn" href="presentations/Progress_Presentation_II.pdf" download>Download</a>
</div>
<iframe src="presentations/Progress_Presentation_II.pdf#toolbar=0&navpanes=0&scrollbar=1"></iframe>
</body>
</html>
